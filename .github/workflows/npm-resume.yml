name: Build CV

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HTML and PDF in NodeTools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout NodeTools environment
        uses: actions/checkout@v5
        with:
          repository: marmits/nodetools
          ref: dev
          path: .nodetools
          persist-credentials: false

      - name: Cache npm and Puppeteer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: ${{ runner.os }}-node24-cv-build-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-cv-build-

      - name: Prepare caches
        run: mkdir -p "$HOME/.npm" "$HOME/.cache/puppeteer"

      - name: Build NodeTools image
        run: docker build --tag marmits-nodetools:ci .nodetools

      - name: Install dependencies and build CV
        run: |
          docker run --rm --init \
            --volume "$GITHUB_WORKSPACE:/app/cvmilo" \
            --volume "$HOME/.npm:/root/.npm" \
            --volume "$HOME/.cache/puppeteer:/root/.cache/puppeteer" \
            --workdir /app/cvmilo \
            marmits-nodetools:ci \
            zsh -lc 'npm ci && npm test && npm run build && mkdir -p dist && cp index.html resume.pdf dist/'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

